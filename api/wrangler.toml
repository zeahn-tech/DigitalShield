name = "digitalshield"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Serve the built SPA from the same Worker (assets first, API on /api/*)
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker handles /api/* first, then delegates to static assets.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "DS_DB"
database_id = "45fa57d8-5a69-4a10-b568-501cbff44364"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "digitalshield-files"

[vars]
# Production values — deployed by .github/workflows/deploy.yml.
# Local `wrangler dev` overrides these from api/.dev.vars (copy api/.dev.vars.example).
APP_ORIGIN = "https://digitalshield.emmanuelzeahn45.workers.dev"
# Pilot launch: no outbound mailer is wired yet (README "Honest limitations"),
# so verification is off to keep registration usable end-to-end.
# Flip to "1" together with wiring api/src/lib/mailer.ts.
REQUIRE_EMAIL_VERIFICATION = "0"
# Structurally inert off loopback origins (loadConfig) — set explicitly anyway.
DEV_MODE = "0"
SESSION_TTL_SECONDS = "1209600"
MAX_UPLOAD_BYTES = "26214400"
MAX_IMPORT_FILES = "200"

# Production secrets (set via `wrangler secret put` or Sites → Secrets):
# - ENCRYPTION_MASTER_KEY
# - EMAIL_PROVIDER_API_KEY
# - EXA_API_KEY   (web search for Scam Shield; server-side only)
