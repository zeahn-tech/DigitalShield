<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DigitalShield helps you preserve important digital assets, prepare for account emergencies, organize recovery evidence, and navigate legitimate account-recovery processes."
    />
    <meta name="theme-color" content="#0b2545" />
    <title>DigitalShield — Protect what you've built online</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%2314508c' d='M16 2 4 7v9c0 7.5 5.1 12.4 12 14 6.9-1.6 12-6.5 12-14V7L16 2z'/%3E%3Cpath fill='%23fff' d='m14.5 20.5-4-4 1.8-1.8 2.2 2.2 6-6L22.3 13l-7.8 7.5z'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Static-mirror provenance banner. Shown ONLY on GitHub Pages hosts
         (*.github.io); the real DigitalShield backend (Cloudflare deploy) never
         displays it. Prevents the mirror from posing as the full service. -->
    <script>
      (function () {
        var h = window.location.hostname;
        if (h === "localhost" || h === "127.0.0.1" || h.indexOf(".") === -1 || !/\.github\.io$/.test(h)) return;
        var b = document.createElement("div");
        b.setAttribute("role", "note");
        b.setAttribute("aria-label", "Static mirror notice");
        var link =
          '<a href="https://github.com/zeahn-tech/DigitalShield/actions/workflows/deploy.yml" style="color:inherit;text-decoration:underline">Deploy workflow</a>';
        var text =
          '<strong>Static mirror</strong> — this GitHub Pages deployment previews the UI only. ' +
          'Accounts, vault, recovery cases and the API require the DigitalShield backend on Cloudflare. ' +
          'Deploy it with the ' + link + '.';
        b.innerHTML = text;
        b.style.cssText =
          'position:sticky;top:0;z-index:100;' +
          'font:600 13px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;' +
          'background:#fdf1d8;color:#6b4600;border-bottom:1px solid #eed9a8;' +
          'padding:9px 14px;text-align:left';
        document.body.insertBefore(b, document.body.firstChild);
      })();
    </script>
  </body>
</html>
